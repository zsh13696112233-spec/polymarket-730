[project]
name = "polymarket-wallet-monitor"
version = "0.1.0"
description = "Local, read-only Polymarket wallet position monitor"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21.0,<1",
  "alembic>=1.16.0,<2",
  "fastapi>=0.116.0,<1",
  "httpx>=0.28.0,<1",
  "python-dotenv>=1.1.0,<2",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0,<9",
  "pytest-asyncio>=1.0.0,<2",
  "ruff>=0.12.0,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
